name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything whose answer cannot depend on the platform or the Node version, run
  # once each. Splitting them keeps one run reporting every failing stage.
  check:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: lint
            run: pnpm lint
          - name: format
            run: pnpm format:check
          - name: typecheck
            run: pnpm typecheck
          - name: no runtime dependencies
            run: pnpm verify:deps

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.run }}

  # The parts that can differ. `engines` claims >=22, so both 22 and 24 are tested
  # rather than assumed, and macOS is here because the global-scope layouts (volta,
  # Homebrew, nvm) are filesystem conventions that differ per platform.
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The one thing that cannot be checked by running a script: the package must still
  # start and serve the UI once built, from the published file list alone.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Boot the server and check it serves
        run: |
          node bin/packui.mjs --no-open --port 7225 . > /tmp/packui.log 2>&1 &
          for _ in $(seq 1 30); do
            grep -q 'packui  http' /tmp/packui.log && break
            sleep 1
          done
          cat /tmp/packui.log

          url=$(grep -o 'http://127.0.0.1:7225/?t=[A-Za-z0-9_-]*' /tmp/packui.log)
          token=${url##*t=}
          if [ -z "$token" ]; then echo "server did not start"; exit 1; fi

          # The UI shell must be served.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7225/")
          [ "$code" = "200" ] || { echo "UI returned $code"; exit 1; }

          # ...under a policy with no 'unsafe-inline'. The README renderer's second layer.
          policy=$(curl -s -D - -o /dev/null "http://127.0.0.1:7225/" | tr -d '\r' \
            | grep -i '^content-security-policy:')
          echo "$policy"
          case "$policy" in
            *unsafe-inline*) echo "CSP allows inline script"; exit 1 ;;
            *"script-src 'self'"*) ;;
            *) echo "no usable content-security-policy on the shell"; exit 1 ;;
          esac

          # The API must answer with a valid token.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7225/api/deps?t=$token")
          [ "$code" = "200" ] || { echo "authorised API call returned $code"; exit 1; }

          # ...and must refuse without one. A regression here is a security regression.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7225/api/deps")
          [ "$code" = "401" ] || { echo "unauthenticated API call returned $code, expected 401"; exit 1; }

          # Mutations must refuse a foreign origin even with a valid token.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: http://evil.example' -H 'content-type: application/json' \
            -d '{"action":"remove","name":"x","confirm":"x"}' \
            "http://127.0.0.1:7225/api/mutate?t=$token")
          [ "$code" = "403" ] || { echo "cross-origin mutation returned $code, expected 403"; exit 1; }

          # ...including the dev server's port, which is only trusted while PACKUI_DEV is set.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: http://localhost:7332' -H 'content-type: application/json' \
            -d '{"action":"remove","name":"x","confirm":"x"}' \
            "http://127.0.0.1:7225/api/mutate?t=$token")
          [ "$code" = "403" ] || { echo "dev-origin mutation returned $code, expected 403"; exit 1; }

          echo "smoke checks passed"
